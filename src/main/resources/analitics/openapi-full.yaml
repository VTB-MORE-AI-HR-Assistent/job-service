openapi: 3.0.3
info:
  title: VTB AI HR Assistant API
  description: Backend API for AI-powered HR interview automation platform
  version: 1.0.0
  contact:
    name: VTB AI HR Team
    email: support@vtbaihr.com
  license:
    name: Proprietary
    url: https://vtbaihr.com/license

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api-staging.vtbaihr.com/api/v1
    description: Staging server
  - url: https://api.vtbaihr.com/api/v1
    description: Production server

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Users
    description: User profile management
  - name: Vacancies
    description: Job vacancy management
  - name: Candidates
    description: Candidate management
  - name: Interviews
    description: Interview session management
  - name: Daily.co
    description: Daily.co video room integration
  - name: Resumes
    description: Resume processing and analysis
  - name: Questions
    description: Interview question bank management
  - name: Analytics
    description: Analytics and reporting
  - name: Notifications
    description: Email and SMS notifications

paths:
  # Authentication Endpoints
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout and invalidate refresh token
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out successfully

  /auth/validate:
    get:
      tags: [Authentication]
      summary: Validate current token
      operationId: validateToken
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/reset-password-request:
    post:
      tags: [Authentication]
      summary: Request password reset
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Password reset successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  # User Management
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    
    put:
      tags: [Users]
      summary: Update user profile
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Change password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Vacancy Management
  /vacancies:
    get:
      tags: [Vacancies]
      summary: List vacancies
      operationId: listVacancies
      parameters:
        - $ref: '#/components/parameters/statusParam'
        - $ref: '#/components/parameters/departmentParam'
        - $ref: '#/components/parameters/locationParam'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/sortParam'
      responses:
        '200':
          description: List of vacancies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyPage'
    
    post:
      tags: [Vacancies]
      summary: Create vacancy
      operationId: createVacancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVacancyRequest'
      responses:
        '201':
          description: Vacancy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /vacancies/{id}:
    get:
      tags: [Vacancies]
      summary: Get vacancy by ID
      operationId: getVacancy
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Vacancy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDto'
        '404':
          $ref: '#/components/responses/NotFound'
    
    put:
      tags: [Vacancies]
      summary: Update vacancy
      operationId: updateVacancy
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVacancyRequest'
      responses:
        '200':
          description: Vacancy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags: [Vacancies]
      summary: Delete vacancy
      operationId: deleteVacancy
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '204':
          description: Vacancy deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /vacancies/{id}/publish:
    post:
      tags: [Vacancies]
      summary: Publish vacancy
      operationId: publishVacancy
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Vacancy published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDto'

  /vacancies/{id}/archive:
    post:
      tags: [Vacancies]
      summary: Archive vacancy
      operationId: archiveVacancy
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Vacancy archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDto'

  # Candidate Management
  /candidates:
    get:
      tags: [Candidates]
      summary: List candidates
      operationId: listCandidates
      parameters:
        - name: vacancyId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CandidateStatus'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: List of candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePage'
    
    post:
      tags: [Candidates]
      summary: Create candidate
      operationId: createCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '201':
          description: Candidate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDto'

  /candidates/{id}:
    get:
      tags: [Candidates]
      summary: Get candidate by ID
      operationId: getCandidate
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Candidate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDto'
        '404':
          $ref: '#/components/responses/NotFound'
    
    put:
      tags: [Candidates]
      summary: Update candidate
      operationId: updateCandidate
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateRequest'
      responses:
        '200':
          description: Candidate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDto'

  /candidates/{id}/status:
    put:
      tags: [Candidates]
      summary: Update candidate status
      operationId: updateCandidateStatus
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDto'

  # Interview Management
  /interviews:
    get:
      tags: [Interviews]
      summary: List interview sessions
      operationId: listInterviews
      parameters:
        - name: candidateId
          in: query
          schema:
            type: integer
            format: int64
        - name: vacancyId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InterviewStatus'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: List of interviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewPage'
    
    post:
      tags: [Interviews]
      summary: Create interview session
      operationId: createInterview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewRequest'
      responses:
        '201':
          description: Interview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionDto'

  /interviews/{sessionId}:
    get:
      tags: [Interviews]
      summary: Get interview session
      operationId: getInterview
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interview details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionDto'
    
    put:
      tags: [Interviews]
      summary: Update interview session
      operationId: updateInterview
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterviewRequest'
      responses:
        '200':
          description: Interview updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionDto'

  /interviews/validate:
    post:
      tags: [Interviews]
      summary: Validate interview session (public)
      operationId: validateInterview
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateInterviewRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewValidationResponse'

  /interviews/{sessionId}/join:
    post:
      tags: [Interviews]
      summary: Join interview session
      operationId: joinInterview
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinInterviewRequest'
      responses:
        '200':
          description: Room credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomCredentials'

  /interviews/{sessionId}/cancel:
    post:
      tags: [Interviews]
      summary: Cancel interview
      operationId: cancelInterview
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInterviewRequest'
      responses:
        '200':
          description: Interview cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionDto'

  /interviews/{sessionId}/end:
    post:
      tags: [Interviews]
      summary: End interview session
      operationId: endInterview
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndInterviewRequest'
      responses:
        '200':
          description: Interview ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionDto'

  /interviews/{sessionId}/report-issue:
    post:
      tags: [Interviews]
      summary: Report technical issue
      operationId: reportInterviewIssue
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportIssueRequest'
      responses:
        '201':
          description: Issue reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTicketResponse'

  # Interview Results
  /interview-results/{sessionId}:
    get:
      tags: [Interviews]
      summary: Get interview result
      operationId: getInterviewResult
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Interview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewResultDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /interview-results/{sessionId}/review:
    put:
      tags: [Interviews]
      summary: Update interview result review
      operationId: reviewInterviewResult
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInterviewRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewResultDto'

  /interview-results/{sessionId}/report:
    get:
      tags: [Interviews]
      summary: Generate interview report
      operationId: generateInterviewReport
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [PDF, DOCX, HTML]
            default: PDF
        - name: includeTranscript
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Report generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string

  # Daily.co Room Management
  /daily/rooms:
    post:
      tags: [Daily.co]
      summary: Create Daily.co room
      operationId: createDailyRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRoomResponse'

  /daily/rooms/{roomName}:
    get:
      tags: [Daily.co]
      summary: Get Daily.co room status
      operationId: getDailyRoomStatus
      parameters:
        - name: roomName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStatusResponse'
    
    delete:
      tags: [Daily.co]
      summary: Delete Daily.co room
      operationId: deleteDailyRoom
      parameters:
        - name: roomName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Room deleted

  # Resume Processing
  /resumes/upload:
    post:
      tags: [Resumes]
      summary: Upload resume
      operationId: uploadResume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                candidateId:
                  type: integer
                  format: int64
                vacancyId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Resume uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'

  /resumes/{id}/analysis:
    get:
      tags: [Resumes]
      summary: Get resume analysis
      operationId: getResumeAnalysis
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Resume analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeAnalysisResultDto'

  # Question Bank
  /questions:
    get:
      tags: [Questions]
      summary: List questions
      operationId: listQuestions
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/QuestionCategory'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/DifficultyLevel'
        - name: skills
          in: query
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: List of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
    
    post:
      tags: [Questions]
      summary: Create question
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Question created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDto'

  /questions/{id}:
    get:
      tags: [Questions]
      summary: Get question
      operationId: getQuestion
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Question details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDto'
    
    put:
      tags: [Questions]
      summary: Update question
      operationId: updateQuestion
      parameters:
        - $ref: '#/components/parameters/idParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
      responses:
        '200':
          description: Question updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDto'
    
    delete:
      tags: [Questions]
      summary: Delete question
      operationId: deleteQuestion
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '204':
          description: Question deleted

  # Analytics
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Get dashboard analytics
      operationId: getDashboardAnalytics
      parameters:
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsDto'

  /analytics/vacancies/{id}:
    get:
      tags: [Analytics]
      summary: Get vacancy analytics
      operationId: getVacancyAnalytics
      parameters:
        - $ref: '#/components/parameters/idParam'
      responses:
        '200':
          description: Vacancy analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyAnalyticsDto'

  /interviews/statistics:
    get:
      tags: [Analytics]
      summary: Get interview statistics
      operationId: getInterviewStatistics
      parameters:
        - name: vacancyId
          in: query
          schema:
            type: integer
            format: int64
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
      responses:
        '200':
          description: Interview statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStatisticsDto'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    
    sizeParam:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    
    sortParam:
      name: sort
      in: query
      schema:
        type: string
        example: "createdAt,desc"
    
    statusParam:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/VacancyStatus'
    
    departmentParam:
      name: department
      in: query
      schema:
        type: string
    
    locationParam:
      name: location
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Forbidden:
      description: Forbidden
