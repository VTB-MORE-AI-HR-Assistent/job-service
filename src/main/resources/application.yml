spring:
  datasource:
    url: jdbc:postgresql://user-db:5432/aihr
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

  ai:
    openai:
      api-key: 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
      chat:
        options:
          model: gpt-4-turbo-preview
          temperature: 0.1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

server:
  port: 8585

logging:
  level:
    com.aristurtle: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
