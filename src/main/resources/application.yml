spring:
  datasource:
    url: jdbc:postgresql://user-db:5432/aihr
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

  ai:
    openai:
      api-key: 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
      chat:
        options:
          model: gpt-4-turbo-preview
          temperature: 0.1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

server:
  port: 8585

logging:
  level:
    com.aristurtle: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE